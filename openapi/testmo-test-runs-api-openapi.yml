openapi: 3.2.0
info:
  title: Testmo REST Test Runs API
  description: The Testmo REST API provides read access to the major entities of a Testmo unified test management instance - projects, manual test runs and their results, automation runs, automation sources, exploratory sessions, and milestones - so teams can build custom analytics, reporting, and integrations.
  version: '1.0'
  contact:
    name: Testmo
    url: https://www.testmo.com
servers:
- url: https://{instance}.testmo.net/api/v1
  description: Per-instance Testmo API base. Replace {instance} with your Testmo subdomain.
  variables:
    instance:
      default: your-name
      description: Your Testmo instance subdomain (e.g. your-name in your-name.testmo.net).
security:
- bearerAuth: []
tags:
- name: Test Runs
  description: Manual test runs and their individual results.
paths:
  /runs/{run_id}:
    parameters:
    - name: run_id
      in: path
      required: true
      description: The ID of the test run.
      schema:
        type: integer
    get:
      operationId: getRun
      tags:
      - Test Runs
      summary: Get a test run
      description: Retrieves a single manual test run with aggregated statistics and test numbers.
      responses:
        '200':
          description: The requested test run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/runs:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listRuns
      tags:
      - Test Runs
      summary: List test runs for a project
      description: Lists the manual test runs of a project. Returns active or closed runs with aggregated statistics. Supports filtering (for example by milestone, configuration, status, or start date).
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: milestone_id
        in: query
        required: false
        description: Filter runs linked to a specific milestone.
        schema:
          type: integer
      responses:
        '200':
          description: A paginated list of test runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/results:
    parameters:
    - name: run_id
      in: path
      required: true
      description: The ID of the test run.
      schema:
        type: integer
    get:
      operationId: listRunResults
      tags:
      - Test Runs
      summary: List results for a test run
      description: Extracts and filters the individual test results of a manual test run. Results can be filtered by status, creator, and creation date, and related data can be expanded.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: status_id
        in: query
        required: false
        description: Filter results by status (for example Passed, Failed, Blocked).
        schema:
          type: integer
      - name: created_by
        in: query
        required: false
        description: Filter results by the ID of the user who created them.
        schema:
          type: integer
      - name: created_after
        in: query
        required: false
        description: Only results created after this timestamp.
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        required: false
        description: Only results created before this timestamp.
        schema:
          type: string
          format: date-time
      - name: expands
        in: query
        required: false
        description: Comma-separated related resources to expand (for example users,issues).
        schema:
          type: string
      responses:
        '200':
          description: A paginated list of test results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    RunList:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Result:
      type: object
      properties:
        id:
          type: integer
        run_id:
          type: integer
        test_id:
          type: integer
        status_id:
          type: integer
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
    ResultList:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        prev_page:
          type:
          - integer
          - 'null'
        next_page:
          type:
          - integer
          - 'null'
        last_page:
          type: integer
    Run:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        is_closed:
          type: boolean
        milestone_id:
          type:
          - integer
          - 'null'
        result_summary:
          type: object
          additionalProperties: true
  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      description: The number of entries per page.
      schema:
        type: integer
        default: 100
    Page:
      name: page
      in: query
      required: false
      description: The page of results to retrieve.
      schema:
        type: integer
        default: 1
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The ID of the project.
      schema:
        type: integer
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Personal API token generated from your Testmo profile page, passed as `Authorization: Bearer <token>`.'
