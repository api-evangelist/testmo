openapi: 3.2.0
info:
  title: Testmo REST Automation Sources API
  description: The Testmo REST API provides read access to the major entities of a Testmo unified test management instance - projects, manual test runs and their results, automation runs, automation sources, exploratory sessions, and milestones - so teams can build custom analytics, reporting, and integrations.
  version: '1.0'
  contact:
    name: Testmo
    url: https://www.testmo.com
servers:
- url: https://{instance}.testmo.net/api/v1
  description: Per-instance Testmo API base. Replace {instance} with your Testmo subdomain.
  variables:
    instance:
      default: your-name
      description: Your Testmo instance subdomain (e.g. your-name in your-name.testmo.net).
security:
- bearerAuth: []
tags:
- name: Automation Sources
  description: Automation sources grouping runs, with aggregated metrics.
paths:
  /automation/sources/{source_id}:
    parameters:
    - name: source_id
      in: path
      required: true
      description: The ID of the automation source.
      schema:
        type: integer
    get:
      operationId: getAutomationSource
      tags:
      - Automation Sources
      summary: Get an automation source
      description: Retrieves a single automation source with aggregated statistics and metrics.
      responses:
        '200':
          description: The requested automation source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/automation/sources:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAutomationSources
      tags:
      - Automation Sources
      summary: List automation sources for a project
      description: Lists the automation sources of a project, including average and aggregated source statistics and metrics.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A paginated list of automation sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationSourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    AutomationSource:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        statistics:
          type: object
          additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        prev_page:
          type:
          - integer
          - 'null'
        next_page:
          type:
          - integer
          - 'null'
        last_page:
          type: integer
    AutomationSourceList:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/AutomationSource'
        pagination:
          $ref: '#/components/schemas/Pagination'
  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      description: The number of entries per page.
      schema:
        type: integer
        default: 100
    Page:
      name: page
      in: query
      required: false
      description: The page of results to retrieve.
      schema:
        type: integer
        default: 1
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The ID of the project.
      schema:
        type: integer
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Personal API token generated from your Testmo profile page, passed as `Authorization: Bearer <token>`.'
